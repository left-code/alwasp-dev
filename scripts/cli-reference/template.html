<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Searchable ALWasp v{{VERSION}} command-line reference with command syntax, options, and copy controls.">
<title>ALWasp CLI Reference · v{{VERSION}}</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#1c2230;--mute:#667085;--line:#e4e7ee;--acc:#2f6bff;--accbg:#eaf0ff;--code:#0f172a;--codeink:#e2e8f0;--req:#d92d20;--reqbg:#fee4e2;--ok:#067647;--okbg:#dcfae6;--warn:#b54708;--warnbg:#fef0c7}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--panel:#161b26;--ink:#e6e9f0;--mute:#98a2b3;--line:#262d3d;--acc:#7aa2ff;--accbg:#1c2744;--code:#0a0d14;--codeink:#d5dbe8;--req:#ff8a80;--reqbg:#3a1a18;--ok:#6ce9a6;--okbg:#10301f;--warn:#fec84b;--warnbg:#3a2a0a}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:12px 20px}
header h1{font-size:18px;margin:0;white-space:nowrap}header h1 span{color:var(--acc)}
#q{flex:1;max-width:480px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--acc)}
.cnt{color:var(--mute);font-size:13px;white-space:nowrap}
.layout{display:grid;grid-template-columns:250px 1fr;max-width:1280px;margin:0 auto}
nav{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:16px 8px 24px 20px;font-size:14px}
nav a{display:block;color:var(--ink);text-decoration:none;padding:3px 8px;border-radius:6px}
nav a:hover{background:var(--accbg)}nav a.g{font-weight:600;margin-top:10px}nav a.c{padding-left:20px;color:var(--mute)}
main{padding:24px 20px 80px;min-width:0}
.intro,.group{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.intro{padding:20px;margin-bottom:24px}.intro p{margin:4px 0 14px;color:var(--mute)}
.group{margin-bottom:28px;padding:6px 20px 14px}
.group>h2{font-size:22px;margin:14px 0 2px}.group>h2 code{color:var(--acc)}.group>p{margin:0 0 12px;color:var(--mute)}
.cmd{margin:14px 0;padding:16px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.cmd h3{margin:0;font-size:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.cmd h3 .p{color:var(--mute);font-weight:400}.cmd>p{margin:4px 0 10px;color:var(--mute)}
.usage{display:flex;gap:8px;align-items:center;background:var(--code);color:var(--codeink);border-radius:8px;padding:8px 12px;margin:8px 0 12px;font:13px/1.4 ui-monospace,Consolas,monospace}
.usage code{flex:1;overflow-x:auto;white-space:nowrap}.usage .dollar{color:#7dd3a8}
button.copy{background:#ffffff1a;color:inherit;border:0;border-radius:6px;padding:3px 9px;cursor:pointer;font:12px system-ui}
button.copy:hover{background:#ffffff33}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border-radius:8px;overflow:hidden}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}
td.f{white-space:nowrap;font:13px ui-monospace,Consolas,monospace;color:var(--acc)}
td.f i{font-style:normal;color:var(--mute)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;margin-left:6px;vertical-align:1px}
.req{background:var(--reqbg);color:var(--req)}.def{background:var(--okbg);color:var(--ok)}.sw{background:var(--warnbg);color:var(--warn)}
h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.none{color:var(--mute);font-size:13px;font-style:italic;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags a{background:var(--accbg);color:var(--acc);padding:2px 10px;border-radius:12px;font-size:13px;text-decoration:none}
.hide{display:none!important}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav{display:none}header{flex-wrap:wrap}td.f{white-space:normal;word-break:break-word}}

[hidden]{display:none!important}
header .version{font-size:12px;color:var(--mute)}
header .docs{font-size:13px;color:var(--acc);white-space:nowrap}
h2{margin-top:0}.cmd h3 a{color:inherit;text-decoration:none}.cmd h3 a:hover{color:var(--acc)}
.table-wrap{overflow-x:auto}td.f{white-space:normal;min-width:180px;overflow-wrap:anywhere}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
footer{color:var(--mute);font-size:13px;margin-top:24px}
#empty{padding:20px;background:var(--panel);border-radius:12px;border:1px solid var(--line)}
@media(max-width:820px){header{gap:8px;padding:10px 14px}#q{order:2;flex-basis:100%;max-width:none}.cnt{margin-left:auto}main{padding:18px 10px}.group{padding:6px 10px 12px}.cmd{padding:12px}.docs{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{header{position:static}#q,.copy,nav,.docs{display:none}.layout{display:block}body{background:#fff;color:#111}.cmd,.group{break-inside:avoid}.usage{background:#eee;color:#111}main{padding:0}}
</style>
</head>
<body>
<header><h1><span>alwasp</span> CLI Reference <span class="version">v{{VERSION}}</span></h1><label class="sr-only" for="q">Filter commands, options, and descriptions</label><input id="q" type="search" placeholder="Filter commands, options, descriptions… (press /)" aria-controls="main"><span class="cnt" id="cnt" role="status" aria-live="polite">{{COUNT}} commands</span><a class="docs" href="/docs/cli-reference/">CLI guide ↗</a></header>
<div class="layout"><nav id="nav" aria-label="CLI commands">{{NAV}}</nav><main id="main">{{CONTENT}}<p id="empty" hidden>No matching commands. Try another term or press Escape to clear the filter.</p><footer>ALWasp v{{VERSION}} · <a href="/docs/release-notes/">Release notes</a> · <a href="/">alwasp.dev</a></footer></main></div>
<p id="copy-status" class="sr-only" role="status" aria-live="polite"></p>
<noscript><p>Command search and copy buttons require JavaScript. All commands and options remain readable.</p></noscript>

<script>
const q=document.getElementById("q");
const cards=[...document.querySelectorAll(".cmd[data-s]")];
const count=document.getElementById("cnt");
function filter(){
 const terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 let shown=0;
 for(const card of cards){
  const visible=terms.every(term=>card.dataset.s.includes(term));
  card.hidden=!visible;if(visible)shown++;
 }
 for(const group of document.querySelectorAll(".group"))group.hidden=![...group.querySelectorAll(".cmd")].some(card=>!card.hidden);
 document.querySelector(".intro").hidden=terms.length>0;
 for(const link of document.querySelectorAll("#nav a")){
  const target=document.getElementById(link.hash.slice(1));
  link.hidden=target?.hidden??false;
 }
 count.textContent=shown+" of "+cards.length+" commands";
 document.getElementById("empty").hidden=shown>0;
}
q.addEventListener("input",filter);
document.addEventListener("keydown",event=>{
 const editing=event.target.closest("input,textarea,[contenteditable]");
 if(event.key==="/"&&!editing&&!event.ctrlKey&&!event.metaKey&&!event.altKey){event.preventDefault();q.focus();}
 if(event.key==="Escape"&&document.activeElement===q){q.value="";filter();}
});
document.addEventListener("click",async event=>{
 const button=event.target.closest("button.copy");if(!button)return;
 try{
  if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(button.dataset.c);
  else{
   const textarea=document.createElement("textarea");textarea.value=button.dataset.c;textarea.style.position="fixed";textarea.style.opacity="0";
   document.body.append(textarea);textarea.select();
   const copied=document.execCommand("copy");textarea.remove();button.focus();
   if(!copied)throw new Error("Clipboard unavailable");
  }
  button.textContent="Copied";document.getElementById("copy-status").textContent="Command usage copied.";
 }catch{
  button.textContent="Select text";
  const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(button.parentElement.querySelector("code"));
  selection.removeAllRanges();selection.addRange(range);
  document.getElementById("copy-status").textContent="Copy the selected command text.";
 }
 setTimeout(()=>button.textContent="Copy",1500);
});
function followHash(){
 if(q.value){q.value="";filter();}
 const target=document.getElementById(location.hash.slice(1));
 if(target)target.scrollIntoView();
}
window.addEventListener("hashchange",followHash);
const params=new URLSearchParams(location.search);
if(params.has("q")){q.value=params.get("q");filter();}
</script>

</body>
</html>
